<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">The authority ladder for an AI agent</title>
  <desc id="description">A five step ladder showing increasing agent authority from inform to decide. The first three steps are allowed or user visible. Executing actions requires human approval. Decisions are never delegated.</desc>
  <rect width="1440" height="900" fill="#F7F6F1"/>
  <text x="110" y="125" fill="#162A3A" font-family="Georgia, serif" font-size="54" font-weight="700">The authority ladder</text>
  <text x="110" y="174" fill="#496071" font-family="Arial, sans-serif" font-size="26">Grant an agent the lowest level of authority that still creates value.</text>
  <path d="M118 747 H1315" stroke="#CAD2D7" stroke-width="4"/>
  <g font-family="Arial, sans-serif">
    <rect x="175" y="625" width="180" height="122" rx="12" fill="#C7E6D3"/>
    <text x="265" y="678" fill="#173B2A" font-size="31" font-weight="700" text-anchor="middle">1</text>
    <text x="265" y="718" fill="#173B2A" font-size="25" font-weight="700" text-anchor="middle">Inform</text>
    <text x="265" y="789" fill="#496071" font-size="19" text-anchor="middle">Explain approved facts</text>
    <rect x="385" y="535" width="180" height="212" rx="12" fill="#C7E6D3"/>
    <text x="475" y="588" fill="#173B2A" font-size="31" font-weight="700" text-anchor="middle">2</text>
    <text x="475" y="628" fill="#173B2A" font-size="25" font-weight="700" text-anchor="middle">Recommend</text>
    <text x="475" y="677" fill="#496071" font-size="19" text-anchor="middle">Suggest a safe</text>
    <text x="475" y="704" fill="#496071" font-size="19" text-anchor="middle">next step</text>
    <rect x="595" y="445" width="180" height="302" rx="12" fill="#C7E6D3"/>
    <text x="685" y="498" fill="#173B2A" font-size="31" font-weight="700" text-anchor="middle">3</text>
    <text x="685" y="538" fill="#173B2A" font-size="25" font-weight="700" text-anchor="middle">Prepare</text>
    <text x="685" y="587" fill="#496071" font-size="19" text-anchor="middle">Draft an action for</text>
    <text x="685" y="614" fill="#496071" font-size="19" text-anchor="middle">the user to review</text>
    <rect x="805" y="355" width="180" height="392" rx="12" fill="#F5D49C"/>
    <text x="895" y="408" fill="#613D08" font-size="31" font-weight="700" text-anchor="middle">4</text>
    <text x="895" y="448" fill="#613D08" font-size="25" font-weight="700" text-anchor="middle">Execute</text>
    <text x="895" y="497" fill="#75521D" font-size="19" text-anchor="middle">Change an external</text>
    <text x="895" y="524" fill="#75521D" font-size="19" text-anchor="middle">system or record</text>
    <rect x="837" y="569" width="116" height="39" rx="19" fill="#FFF6E5"/>
    <text x="895" y="595" fill="#613D08" font-size="16" font-weight="700" text-anchor="middle">HUMAN APPROVAL</text>
    <rect x="1015" y="265" width="180" height="482" rx="12" fill="#E9C1C1"/>
    <text x="1105" y="318" fill="#6D2424" font-size="31" font-weight="700" text-anchor="middle">5</text>
    <text x="1105" y="358" fill="#6D2424" font-size="25" font-weight="700" text-anchor="middle">Decide</text>
    <text x="1105" y="407" fill="#7A3E3E" font-size="19" text-anchor="middle">Make a people, legal,</text>
    <text x="1105" y="434" fill="#7A3E3E" font-size="19" text-anchor="middle">or entitlement decision</text>
    <rect x="1047" y="479" width="116" height="39" rx="19" fill="#FFF0F0"/>
    <text x="1105" y="505" fill="#6D2424" font-size="16" font-weight="700" text-anchor="middle">NEVER DELEGATE</text>
  </g>
  <path d="M1235 730 V306" stroke="#496071" stroke-width="3"/>
  <path d="M1219 325 L1235 299 L1251 325" fill="none" stroke="#496071" stroke-width="3"/>
  <text x="1282" y="528" fill="#496071" font-family="Arial, sans-serif" font-size="20" transform="rotate(-90 1282 528)">Increasing authority and potential impact</text>
  <text x="110" y="847" fill="#496071" font-family="Arial, sans-serif" font-size="21">The model can propose. Policy and human review control consequential actions.</text>
</svg>
